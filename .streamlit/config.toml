# ============================================================
# Fission AI - Streamlit Configuration
# Modern AI Creative Studio Theme (Linear / Notion / Midjourney Aesthetic)
# ============================================================

[theme]
primaryColor = "#7C5CFF"
backgroundColor = "#0B0B12"
secondaryBackgroundColor = "#14141F"
textColor = "#F2F2F7"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
